plugins {
    id 'application'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

dependencies {
    implementation project(':tools:accent-language-tools')
    implementation 'org.eclipse.lsp4j:org.eclipse.lsp4j:0.22.0'
    
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

application {
    mainClass = 'accent.tools.server.AccentLanguageServerLauncher'
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
    options.encoding = 'UTF-8'
    options.compilerArgs += ['-Xlint:all', '-Werror']
}

tasks.named('test') {
    useJUnitPlatform()
    jvmArgs('-XX:+EnableDynamicAgentLoading')
}

tasks.named('startScripts', CreateStartScripts) {
    doLast {
        File scriptFile = new File(outputDir, applicationName)
        if (scriptFile.exists()) {
            String text = scriptFile.text
            String fallback = '''
# Auto-detect bundled JDK if JAVA_HOME is not set
if [ -z "$JAVA_HOME" ] && ! command -v java >/dev/null 2>&1; then
    if [ -x "$APP_HOME/../../../../../jdk/bin/java" ]; then
        JAVA_HOME="$(cd "$APP_HOME/../../../../../jdk" && pwd)"
    fi
fi
'''
            scriptFile.text = text.replace('# Determine the Java command to use to start the JVM.', fallback + '\n# Determine the Java command to use to start the JVM.')
        }
    }
}
