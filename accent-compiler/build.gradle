plugins {
    id 'application'
    id 'java-library'
    id 'maven-publish'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
    withSourcesJar()
    withJavadocJar()
}

application {
    mainClass = 'io.lemadane.accent.cli.AccentCli'
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
    options.encoding = 'UTF-8'
    options.compilerArgs += ['-Xlint:all', '-Werror']
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}

tasks.named('jar') {
    manifest {
        attributes('Main-Class': application.mainClass.get())
    }
}

sourceSets {
    main {
        java {
            srcDirs += ['build/generated/sources/accent/main']
        }
    }
    test {
        java {
            srcDirs += ['build/generated/sources/accent/test']
        }
        resources {
            srcDirs += ['src/test/accent']
        }
    }
}

tasks.register('compileAccent', JavaExec) {
    group = 'build'
    description = 'Compiles main Accent source files to Java.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'io.lemadane.accent.cli.AccentCli'
    
    doFirst {
        new File('build/generated/sources/accent/main').mkdirs()
    }
    
    args 'compile', 'src/main/accent', '-d', 'build/classes/java/main', '-cp', sourceSets.main.compileClasspath.asPath, '--save-java'
    
    inputs.dir('src/main/accent').optional()
    outputs.dir('build/generated/sources/accent/main')
    
    dependsOn tasks.named('classes')
}

tasks.register('compileTestAccent', JavaExec) {
    group = 'build'
    description = 'Compiles test Accent source files to Java.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'io.lemadane.accent.cli.AccentCli'
    
    doFirst {
        new File('build/generated/sources/accent/test').mkdirs()
    }
    
    args 'compile', 'src/test/accent', '-d', 'build/classes/java/test', '-cp', sourceSets.test.compileClasspath.asPath, '--save-java'
    
    inputs.dir('src/test/accent').optional()
    outputs.dir('build/generated/sources/accent/test')
    
    dependsOn tasks.named('classes')
}

tasks.named('compileTestJava') {
    dependsOn tasks.named('compileTestAccent')
}

tasks.register('checkAccent', JavaExec) {
    group = 'verification'
    description = 'Lexes and validates the example Accent source file.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = application.mainClass
    args 'check', 'examples/HelloAccent.accent'
    dependsOn tasks.named('classes')
}

def rootDirDir = project.rootDir
def buildDirDir = project.buildDir

tasks.register('compileStringInterpolationTest', JavaExec) {
    group = 'build'
    description = 'Compiles the standalone String Interpolation test application to Java.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'io.lemadane.accent.cli.AccentCli'
    
    def classDir = new File(buildDirDir, 'classes/java/demo')
    doFirst {
        classDir.mkdirs()
    }
    
    args 'compile', "${rootDirDir}/accent-compiler/src/e2e/examples/StringInterpolationTest.accent", '-d', "${buildDirDir}/classes/java/demo", '-cp', sourceSets.main.compileClasspath.asPath, '--save-java'
    
    dependsOn tasks.named('classes')
}

tasks.register('runStringInterpolationTest', JavaExec) {
    group = 'verification'
    description = 'Runs the standalone String Interpolation test application.'
    classpath = files("${buildDirDir}/classes/java/demo") + sourceSets.main.runtimeClasspath
    mainClass = 'test.StringInterpolationTest'
    dependsOn tasks.named('compileStringInterpolationTest')
}

