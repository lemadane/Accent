<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Cyan to Electric Blue Gradient -->
    <linearGradient id="jatotGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F5FF" />
      <stop offset="50%" stop-color="#00ADFF" />
      <stop offset="100%" stop-color="#0066FF" />
    </linearGradient>

    <!-- Outer Glow Effect -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Deep Dark Navy Background -->
  <rect width="512" height="512" fill="#010816" />

  <!-- Outer Glowing Circle Ring -->
  <circle cx="256" cy="256" r="185" fill="none" stroke="url(#jatotGrad)" stroke-width="18" filter="url(#glow)" />

  <!-- Monogram Mark -->
  <g fill="url(#jatotGrad)" filter="url(#glow)">
    <!-- Top Horizontal Crossbar -->
    <path d="
      M 170 178
      L 350 178
      L 330 208
      L 150 208
      Z
    " />

    <!-- Left Hook (J) -->
    <path d="
      M 195 208
      L 240 208
      L 220 272
      C 214 290 196 316 166 316
      L 138 316
      L 174 286
      L 182 286
      C 194 286 203 276 206 262
      Z
    " />

    <!-- Right Hook (T Stem / Second J) -->
    <path d="
      M 270 208
      L 315 208
      L 295 272
      C 289 290 271 316 241 316
      L 213 316
      L 249 286
      L 257 286
      C 269 286 278 276 281 262
      Z
    " />
  </g>
</svg>
